<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malek & JO-Anne</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #f5efe5;
      font-family: Georgia, "Times New Roman", serif;
    }

    .opening-screen {
      width: 100vw;
      height: 100vh;

      background-image: url("خلفية.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .envelope {
      width: min(72vw, 430px);
      height: auto;
      display: block;
    }

    .open-button {
      margin-top: 34px;

      background: none;
      border: none;
      padding: 0;

      color: #5b1420;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(15px, 3.5vw, 21px);
      letter-spacing: 3px;

      cursor: pointer;
    }

    .ornament {
      margin-top: 9px;
      color: #5b1420;
      font-size: 17px;
      letter-spacing: 3px;
      line-height: 1;
    }
  </style>
</head>

<body>

  <main class="opening-screen">

    <img
      class="envelope"
      src="envelope.png"
      alt="Wedding invitation envelope"
    >

    <button class="open-button">
      OPEN YOUR INVITATION
    </button>

    <div class="ornament">— ♡ —</div>

  </main>

</body>
</html>
